<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookit</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <h1 dir="ltr">Cookit</h1>
    <span class="brand-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20M9 7h6M12 4v6"/></svg></span>
  </header>
  <main>
    <h2 id="heading">Your recipes, together.</h2>
    <p id="intro" class="meta">Save a recipe to your collection.</p>
    <section class="recipe-card" aria-label="Current page">
      <span class="page-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
      <div class="recipe-copy"><p id="page-title" class="recipe-title" dir="auto">Loading current page...</p><p id="page-source" class="meta source" dir="ltr"></p></div>
    </section>
    <button id="save" class="primary" disabled><span id="action-label">Save to my recipes</span><svg hidden id="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="book" class="book">Open my recipe book</button>
    <p id="status" class="status meta" role="status" aria-live="polite"></p>
  </main>
  <footer>
    <div id="account" class="account" hidden><span class="account-dot" aria-hidden="true"></span><span id="account-email" dir="ltr"></span></div>
    <button id="auth" class="auth" disabled>Sign in with Google</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
